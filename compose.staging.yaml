name: care-platform

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care-platform-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: api
      PORT: '3000'
      DATABASE_URL: postgres://care_platform_app:${POSTGRES_PASSWORD}@care-platform-postgres:5432/care_platform_staging
      REDIS_HOST: care-platform-redis
      REDIS_PORT: '6379'
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      SUPABASE_PLATFORM_AUDIENCE: ${SUPABASE_PLATFORM_AUDIENCE}
      SUPABASE_TENANT_AUDIENCE: ${SUPABASE_TENANT_AUDIENCE}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care-platform-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: worker
      DATABASE_URL: postgres://care_platform_app:${POSTGRES_PASSWORD}@care-platform-postgres:5432/care_platform_staging
      REDIS_HOST: care-platform-redis
      REDIS_PORT: '6379'
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      SUPABASE_PLATFORM_AUDIENCE: ${SUPABASE_PLATFORM_AUDIENCE}
      SUPABASE_TENANT_AUDIENCE: ${SUPABASE_TENANT_AUDIENCE}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      WORKER_CONCURRENCY: '5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care-platform-relay
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUNTIME_ROLE: relay
      DATABASE_URL: postgres://care_platform_app:${POSTGRES_PASSWORD}@care-platform-postgres:5432/care_platform_staging
      REDIS_HOST: care-platform-redis
      REDIS_PORT: '6379'
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      SUPABASE_PLATFORM_AUDIENCE: ${SUPABASE_PLATFORM_AUDIENCE}
      SUPABASE_TENANT_AUDIENCE: ${SUPABASE_TENANT_AUDIENCE}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    container_name: care-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: care_platform_staging
      POSTGRES_USER: care_platform_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U care_platform_app -d care_platform_staging']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: care-platform-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: care-platform-migrate
    working_dir: /app/packages/database
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://care_platform_app:${POSTGRES_PASSWORD}@care-platform-postgres:5432/care_platform_staging
    command: ['migrate', '--config', 'drizzle.config.ts']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  # Kept external so a compose teardown can never remove staging state.
  postgres-data:
    external: true
    name: care-platform_postgres-data
  redis-data:
    external: true
    name: care-platform_redis-data

networks:
  proxy-network:
    external: true
