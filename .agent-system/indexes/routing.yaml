# Conditional design-documentation loading for UI tasks.
# Semantics: when a task touches UI, agents ALWAYS read docs/design/DESIGN.md,
# then load the union of topic files whose keywords match the task. Never load
# the whole docs/design directory. App skill comes from the primary agent.
design_routing:
  source_of_truth: docs/design/DESIGN.md
  always_load:
  - docs/design/DESIGN.md
  applies_to_agents:
  - frontend-admin
  - storefront
  app_skills:
    frontend-admin: nextjs-admin
    storefront: nextjs-storefront
  base_skills:
  - frontend-design
  - frontend-design-system
  - vercel-react-best-practices
  - accessibility
  rule: Always load source_of_truth; then load the union of matching topic files
    below plus base_skills and the app skill of the primary agent; do not modify
    docs/design/
  topics:
  - id: tokens-colors
    keywords:
    - color
    - palette
    - oklch
    - theme variable
    - status colors
    - dark mode
    load:
    - docs/design/tokens/colors.md
    skills: []
  - id: tokens-typography
    keywords:
    - typography
    - font
    - mono
    - text size
    - tracking
    - heading scale
    load:
    - docs/design/tokens/typography.md
    skills: []
  - id: tokens-spacing
    keywords:
    - spacing
    - padding
    - gap
    - container width
    - radius
    - shadow
    - layout scale
    load:
    - docs/design/tokens/spacing.md
    skills: []
  - id: tokens-motion
    keywords:
    - motion
    - animation
    - transition
    - easing
    - reduced motion
    - skeleton
    - spinner
    load:
    - docs/design/tokens/motion.md
    skills: []
  - id: components-buttons
    keywords:
    - button
    - primary action
    - destructive action
    - ghost button
    - focus ring
    - cta
    load:
    - docs/design/components/buttons.md
    skills:
    - vercel-composition-patterns
  - id: components-forms
    keywords:
    - form field
    - input
    - checkbox
    - radio
    - switch
    - label
    - helper text
    load:
    - docs/design/components/forms.md
    skills:
    - vercel-composition-patterns
  - id: components-navigation
    keywords:
    - navigation
    - rail
    - top bar
    - breadcrumb
    - tabs
    - menu
    load:
    - docs/design/components/navigation.md
    skills: []
  - id: components-tables
    keywords:
    - table
    - column
    - row
    - cell
    - numeric alignment
    - pagination
    load:
    - docs/design/components/tables.md
    skills:
    - vercel-composition-patterns
  - id: patterns-dashboard
    keywords:
    - dashboard
    - metric card
    - kpi
    - chart
    - exception list
    - activity feed
    load:
    - docs/design/patterns/dashboard.md
    skills:
    - web-design-guidelines
  - id: patterns-data-table
    keywords:
    - data table
    - search filters
    - sorting
    - bulk action
    - export
    - filter preservation
    load:
    - docs/design/patterns/data-table.md
    skills:
    - web-design-guidelines
  - id: patterns-forms
    keywords:
    - record form
    - form sections
    - inline validation
    - unsaved changes
    - save action
    load:
    - docs/design/patterns/forms.md
    skills: []
  - id: patterns-responsive
    keywords:
    - responsive
    - breakpoint
    - narrow viewport
    - mobile layout
    - horizontal scroll
    load:
    - docs/design/patterns/responsive.md
    skills:
    - web-design-guidelines

# Mandatory Design Compliance Review Gate for UI/frontend tasks.
# Any task matching trigger_keywords cannot be accepted until the reviewer
# passes docs/design/review-checklist.md against DESIGN.md plus only the
# task-relevant token/component/pattern files from design_routing topics.
design_review_gate:
  checklist: docs/design/review-checklist.md
  trigger_keywords:
  - frontend
  - ui
  - ux
  - page
  - component
  - layout
  - responsive
  - styling
  - dashboard
  enforced_by:
  - reviewer
  triggered_for_agents:
  - frontend-admin
  - storefront
  - sales-pos
  required_for_acceptance:
  - functional tests pass
  - design compliance review passes
  - accessibility checks pass where relevant
  compare_against:
    always:
    - docs/design/DESIGN.md
    task_relevant: design_routing topics for this task
  reject_on:
  - invented colors or raw color values
  - invented spacing scales
  - unnecessary new components
  - inconsistent typography
  - arbitrary shadows/radii
  - duplicate patterns
  - inaccessible interactions
  - responsive regressions
  gap_policy: mark Design Gap; never silently invent a permanent new pattern;
    request a human design decision when the gap is material
