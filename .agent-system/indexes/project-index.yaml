project: multi-tenant-commerce-platform
greenfield: true
package_manager: pnpm
monorepo: turborepo
apps:
  api:
  - NestJS
  - Fastify
  - TypeScript
  admin:
  - Next.js
  - React
  - TypeScript
  - Tailwind
  platform-admin:
  - Next.js
  - React
  - TypeScript
  - Tailwind
  storefront:
  - Next.js
  - React
  - TypeScript
  - Tailwind
  pos:
  - Tauri 2
  - Rust
  - React
  - TypeScript
  mobile:
  - Flutter
  - DEFERRED
services:
  database: PostgreSQL
  orm: Drizzle
  cache_queue: Redis + BullMQ
  auth: Supabase Auth
  object_storage: Cloudflare R2
design_system:
  source_of_truth: docs/design/DESIGN.md
  directory: docs/design
  subdirectories:
    tokens: docs/design/tokens
    components: docs/design/components
    patterns: docs/design/patterns
  review_checklist: docs/design/review-checklist.md
  rule: Every UI implementation task reads docs/design/DESIGN.md first, then loads only task-relevant token/component/pattern files via routing.yaml design_routing; never modify approved design decisions in docs/design/
  design_review_gate: mandatory for all UI tasks per routing.yaml design_review_gate and docs/design/review-checklist.md
human_checkpoints:
- business-decision
- destructive-migration
- breaking-public-api
- security-tradeoff
- production-deploy
- scope-expansion
- git-push
- git-merge
quality: all required gates green
state_files:
- docs/state/STATE.md
- docs/state/TASKS.md
- docs/state/DECISIONS.md
- docs/state/MIGRATION_STATUS.md
